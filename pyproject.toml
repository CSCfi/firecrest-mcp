[project]
name = "firecrest-mcp"
version = "0.3.0"
description = "FirecREST v2 MCP server"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.5",
    "pyfirecrest>=3.10.0",
    "cachetools",
    "pyjwt>=2",
    "pydantic>=2",
    "httpx>=0.28.1",
    "mcp-types>=2.2.0",
]

[project.scripts]
firecrest-mcp = "firecrest_mcp:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=9",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[tool.pytest]
addopts = ["--import-mode=importlib"]

[project]
name = "firecrest-mcp"
version = "0.1.0"
description = "FirecREST v2 MCP server"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0",
    "pyfirecrest>=3.9",
]

[project.scripts]
firecrest-mcp = "firecrest_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
